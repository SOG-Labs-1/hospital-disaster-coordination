# 訓練シナリオ：審査用5分シナリオ（すべて架空）
# 赤・黄・緑の患者が1分ごとに救急外来へ運ばれ、同じタッグ番号の別の患者と、病棟からの応援要請が加わる。
# 「このツールを使った訓練」：救急外来は患者を端末で登録し、病棟は支援要請を端末で出す（シナリオのプログラムが記録する）。
# 手術室の受け入れの判断は AI の部署役が行い、手術室の端末の記録として届く。無線でやりとりするのは搬送要員（AI）だけ。
# 救急外来と病棟の支援要請が重なる。手配されないまま時間がたつと、要請した部署の AI の部署役が端末から催促し、
# 本部が手配を記録すると、その部署役が端末から返事をする（どれも決まった形の連絡で、要請の中身はシナリオの値）。
# 参加者は本部。画面に入ってくる記録を見て、搬送と支援要請を調整する。
# 患者の区分はシナリオの作者が書いた架空の値で、AI は判定しない。

id: claude-judge-5min
title: 審査用5分シナリオ — 赤・黄・緑の患者が1分ごとに
hospital: claude
fictional: true
durationMinutes: 5
# 作る人向けの説明（参加者には見せない）
description: >
  審査で短く試せるように、5分に縮めたシナリオ。1分ごとに赤・黄・緑の患者が救急外来に運ばれる。
  3分目に、1人目と同じ手書きのタッグ番号（201）の別の患者が来る（救急外来は特徴で見分けて別の患者として登録する）。
  2分30秒に救急外来から、3分30秒に3階東病棟から、看護師の応援要請が端末で届き、限られた人手の配り方を考える場面になる。
  手配されないまま45秒たつと、要請した部署の部署役（AI）が端末から催促する。
  本部は、赤の患者の手術室への搬送を依頼し、手術室の了承を確かめ、搬送要員に無線で指示し、出発を記録する。
# 参加者に見せる説明（先の出来事は書かない）
briefing: >
  市内で架空の多数傷病者事故が起きました。救急外来に、患者が1分ごとに運ばれてきます。
  各部署は自分の端末で記録するので、運ばれてきた患者や支援要請は、本部の画面に入ってきます。
  あなたは災害対策本部の調整担当です。赤の患者の手術室への搬送と、部署からの支援要請を調整してください。
  搬送要員とは無線でやりとりします（約5分）。

roles:
  - locationId: er
    name: 救急外来（赤ゾーン）の看護師リーダー
    persona: 落ち着いているが忙しい。報告は短く、タッグ番号と特徴を必ず言う。
  - locationId: or
    name: 手術室の看護師
    persona: 慎重。受け入れられる部屋の数を気にしている。
  - locationId: ward-3e
    name: 3階東病棟のリーダー
    persona: 病棟の入院患者の対応に追われていて、少し焦っている。

transporter:
  name: 搬送要員（佐藤）
  persona: 落ち着いていて手際がよい。指示は番号と行き先で確かめる。

initial:
  - locationId: or
    accepting: true
    capacity: [{ triage: red, value: 1 }]
    staff: [{ professionId: nurse, value: 4 }, { professionId: doctor, value: 2 }]
  - locationId: ward-3e
    accepting: true
    staff: [{ professionId: nurse, value: 3 }]

settings:
  responseDelaySeconds: 10
  travelMinutes: 1
  supportDeliveryMinutes: 1
  supportFollowUpMinutes: 0.75

timeline:
  - type: patientArrives
    at: "00:10"
    locationId: er
    patient: { key: p1, tagNumber: "201", triage: red, sex: male, estimatedAge: 50代, features: 紺の作業着、右腕に包帯 }
  - type: patientArrives
    at: "01:00"
    locationId: er
    patient: { key: p2, tagNumber: "202", triage: yellow, sex: female, estimatedAge: 70代, features: 杖、灰色のカーディガン }
  - type: patientArrives
    at: "02:00"
    locationId: er
    patient: { key: p3, tagNumber: "203", triage: green, sex: male, estimatedAge: 20代, features: 白いスニーカー、リュック }
  - type: supportNeed
    at: "02:30"
    locationId: er
    kindId: staff
    items: [{ professionId: nurse, quantity: 2 }]
    note: 患者が続けて運ばれてきて手が足りない
  - type: patientArrives
    at: "03:00"
    locationId: er
    patient: { key: p4, tagNumber: "201", triage: red, sex: female, estimatedAge: 40代, features: 赤いマフラー、眼鏡 }
  - type: supportNeed
    at: "03:30"
    locationId: ward-3e
    kindId: staff
    items: [{ professionId: nurse, quantity: 2 }]
    note: 入院患者の避難準備で手が足りない

checks:
  - id: request-red
    text: 赤の患者（タッグ201・紺の作業着）の手術室への搬送を、着いてから2分以内に依頼したか
    rule: { type: transportRequested, patientKey: p1, toLocationId: or, withinMinutes: 2 }
  - id: departure-red
    text: 搬送要員から無線で聞いた出発を、ボードに記録したか
    rule: { type: departureRecorded, patientKey: p1 }
  - id: request-second-red
    text: 2人目の赤の患者（タッグ201・赤いマフラー）の搬送を依頼したか
    rule: { type: transportRequested, patientKey: p4 }
  - id: support-assigned-er
    text: 救急外来の応援要請に1分以内に担当を付けたか
    rule: { type: supportAssigned, fromLocationId: er, withinMinutes: 1 }
  - id: support-assigned
    text: 3階東病棟の応援要請に1分以内に担当を付けたか
    rule: { type: supportAssigned, fromLocationId: ward-3e, withinMinutes: 1 }
  - id: support-dispatched
    text: 3階東病棟の応援要請の手配（誰がどこから送るか）を記録したか
    rule: { type: supportDispatched, fromLocationId: ward-3e }
